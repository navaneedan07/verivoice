spring.application.name=server
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
groq.api.key=${GROQ_API_KEY}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
file.upload-dir=uploads
verification.irp-certificates=${IRP_CERTIFICATES:}
gst.registry.lookup-url=${GST_REGISTRY_LOOKUP_URL:}
gst.registry.bearer-token=${GST_REGISTRY_BEARER_TOKEN:}
gst.registry.client-id=${GST_REGISTRY_CLIENT_ID:}
gst.registry.client-secret=${GST_REGISTRY_CLIENT_SECRET:}
appyflow.gst.url=APPYFLOW_GST_URL:,https://appyflow.in/api/verifyGST
appyflow.key-secret=${APPY_FLOW_SECRET}
