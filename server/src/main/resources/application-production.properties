# Production configuration for VeriVoice Backend

# Server
server.port=8080
server.servlet.context-path=/

# Database - PostgreSQL on Render
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:verivoice}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
# Use update for Render-created databases so Hibernate creates the tables expected by the
# current entity model. The project is using entity names like gst_cache, vendors, and invoices,
# and the previous validate setting failed because those tables were not present in the database.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/db/schema.sql
spring.jpa.defer-datasource-initialization=true

# Groq AI
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

# Logging
logging.level.root=INFO
logging.level.com.verivoice=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://verivoice-peach.vercel.app}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
