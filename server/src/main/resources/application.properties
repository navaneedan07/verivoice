spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.application.name=server
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
file.upload-dir=uploads
verification.irp-certificates=${IRP_CERTIFICATES:}

# Free GSTIN validator
gst.validation.endpoint=${GST_VALIDATOR_ENDPOINT:https://sheet.gstincheck.co.in/check/{apiKey}/{gstin}}
gst.validation.api-key=${GST_VALIDATOR_API_KEY:}
