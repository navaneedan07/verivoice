services:
  - type: web
    name: verivoice-backend
    env: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DB_HOST
        fromDatabase:
          name: verivoice-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: verivoice-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: verivoice-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: verivoice-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: verivoice-postgres
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: GROQ_API_KEY
        value: ${GROQ_API_KEY}
      - key: GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: SERVER_SERVLET_CONTEXT_PATH
        value: /

  - type: pserv
    name: verivoice-postgres
    plan: standard
    ipAllowList: []
    dbName: verivoice
    user: verivoice
    postgresMajorVersion: 15
